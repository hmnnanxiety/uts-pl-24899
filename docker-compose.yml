services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped

    environment:
      POSTGRES_DB: framevault
      POSTGRES_USER: framevault
      POSTGRES_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD is required}"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    image: framevault-backend:local
    restart: unless-stopped

    environment:
      APP_NAME: FrameVault
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: "${APP_KEY:?APP_KEY is required}"
      APP_URL: http://localhost:8080

      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: "5432"
      DB_DATABASE: framevault
      DB_USERNAME: framevault
      DB_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD is required}"

      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      LOG_CHANNEL: stderr

    depends_on:
      db:
        condition: service_healthy

    expose:
      - "80"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api

    image: framevault-frontend:local
    restart: unless-stopped

    ports:
      - "127.0.0.1:8080:80"

    depends_on:
      - backend

volumes:
  postgres_data: